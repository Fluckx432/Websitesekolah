<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2E7D32">
<title>SMK Muhammadiyah Bintan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --hijau-tua:#2E7D32;
  --hijau:#4CAF50;
  --hijau-muda:#A5D6A7;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  color:#333;
  line-height:1.6;
  overflow-x:hidden;
}

/* ================= HEADER ================= */
header{
  background:var(--hijau-tua);
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:70px;
  z-index:1000;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.header-inner{
  max-width:1200px;
  height:70px;
  margin:auto;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:white;
}

nav ul{
  list-style:none;
  display:flex;
  gap:15px;
}

nav a{
  color:white;
  text-decoration:none;
  font-weight:500;
}

/* ================= HERO ================= */
.hero{
  position:relative;
  margin-top:70px;
  background:url('hero.png') center/cover no-repeat;
  color:white;
  text-align:center;
  padding:130px 20px 110px;
  overflow:hidden;
}

/* Overlay khusus buat nutup langit terang */
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(46,125,50,0.90) 0%,
    rgba(46,125,50,0.75) 45%,
    rgba(46,125,50,0.65) 100%
  );
  z-index:0;
}

.hero-content{
  position:relative;
  z-index:1;
  max-width:900px;
  margin:auto;
}

.hero h1{
  font-size:3rem;
  font-weight:700;
  margin-bottom:20px;
}

.hero p{
  font-size:1.2rem;
  margin-bottom:30px;
}

.btn{
  display:inline-block;
  background:var(--hijau);
  padding:14px 34px;
  border-radius:50px;
  color:white;
  text-decoration:none;
  font-weight:600;
  transition:.2s ease;
}

.btn:hover{
  transform:translateY(-3px);
}

/* ================= SECTION ================= */
section{
  padding:80px 20px;
  max-width:1100px;
  margin:auto;
  text-align:center;
}

section h2{
  font-size:2rem;
  color:var(--hijau-tua);
  margin-bottom:30px;
}

/* ================= FOOTER ================= */
footer{
  background:var(--hijau-tua);
  color:white;
  text-align:center;
  padding:40px 20px;
}

/* ================= MOBILE ================= */
@media(max-width:768px){
  .hero h1{
    font-size:2rem;
  }

  .hero p{
    font-size:1rem;
  }

  nav ul{
    gap:10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h3>SMK Muhammadiyah Bintan</h3>
    <nav>
      <ul>
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Profil</a></li>
        <li><a href="#">Berita</a></li>
        <li><a href="#">PPDB</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>SMK Muhammadiyah Bintan</h1>
    <p>Unggul dalam Prestasi, Berakhlak Mulia</p>
    <a href="#" class="btn">Profil Sekolah</a>
  </div>
</section>

<section>
  <h2>Keunggulan Sekolah</h2>
  <p>Sekolah dengan lingkungan nyaman dan tenaga pendidik profesional.</p>
</section>

<footer>
  © 2026 SMK Muhammadiyah Bintan
</footer>

</body>
</html>
